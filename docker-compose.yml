services:
  postgres:
    image: postgres:15-alpine
    container_name: anzara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anzara
      POSTGRES_PASSWORD: anzara
      POSTGRES_DB: anzara_dev
    ports:
      - "5432:5432"
    volumes:
      - anzara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anzara"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anzara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - anzara-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  anzara-postgres-data:
  anzara-redis-data:
